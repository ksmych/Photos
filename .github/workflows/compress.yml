name: 사진 자동 압축

on:
  push:
    paths:
      - 'photos/**'
    branches:
      - main

jobs:
  compress:
    # 봇이 올린 커밋은 다시 실행하지 않음 (무한루프 방지)
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: sharp 설치
        run: npm install sharp

      - name: 사진 압축 실행
        run: node scripts/compress.js

      - name: 압축된 사진 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add photos/
          git diff --staged --quiet && echo "변경사항 없음" || git commit -m "chore: 사진 자동 압축 [skip ci]"
          git push
